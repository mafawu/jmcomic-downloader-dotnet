name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JmComic.slnx

      - name: Build
        run: dotnet build JmComic.slnx -c Release --no-restore

      - name: Test
        run: dotnet test JmComic.slnx -c Release --no-build

      - name: Publish (win-x64)
        run: |
          dotnet publish src/JmComic.App/JmComic.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmcomic-downloader-win-x64
          path: publish/
